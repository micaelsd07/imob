<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | Fabelle</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>FABELLE ADMIN</h1>
            <form id="login-form">
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="email" required placeholder="admin@fabelle.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="123456">
                </div>
                <button type="submit" class="btn">Acessar Painel</button>
            </form>
            <p id="error-msg" style="color: red; margin-top: 1rem; display: none;">Credenciais inválidas.</p>
            <p style="margin-top: 2rem; font-size: 0.8rem; color: #666;">
                <i>Nota para teste: Use email 'admin@fabelle.com' e senha '123456'</i>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simple mock authentication
            if (email === 'admin@fabelle.com' && password === '123456') {
                sessionStorage.setItem('fabelle_admin_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        });

        // If already logged in, redirect
        if (sessionStorage.getItem('fabelle_admin_auth') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
